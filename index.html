<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Equipment Status | TTS Maintenance</title>
    <meta name="description" content="Live equipment status dashboard for TTS shop equipment." />
    <link rel="stylesheet" href="./styles.css?v=20260811-schedule-cleanup" />
  </head>
  <body data-page="dashboard">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list">
          <a class="nav-item active" href="./index.html"><span class="icon">◴</span><span>Live Status</span></a>
          <a class="nav-item" data-viewer-hidden href="./workorders.html"><span class="icon">▤</span><span>Tickets</span></a>
          <a class="nav-item" data-viewer-hidden href="./schedule.html"><span class="icon">▣</span><span>PM Schedules</span></a>
          <a class="nav-item" data-viewer-hidden href="./machines.html"><span class="icon">▧</span><span>Assets</span></a>
          <a class="nav-item" data-viewer-hidden href="./logs.html"><span class="icon">≡</span><span>Reports</span></a>
          <a class="nav-item" data-viewer-hidden href="./settings.html"><span class="icon">*</span><span>Settings</span></a>
        </nav>
        <div class="sidebar-card">
          <span>Open Tickets</span>
          <strong id="sidebarWorkOrders">0</strong>
          <div class="mini-legend">
            <span><i class="dot urgent"></i>Urgent <b id="urgentCount">0</b></span>
            <span><i class="dot high"></i>High <b id="highCount">0</b></span>
            <span><i class="dot medium"></i>Medium <b id="mediumCount">0</b></span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="hamburger" type="button" aria-label="Open menu">☰</button>
          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Search equipment." />
          </label>
          <div class="topbar-actions">
            <span class="user-dot">U</span>
          </div>
        </header>

        <div class="page-heading">
          <h1>Live Equipment Status</h1>
          <div class="updated"><span>Last updated</span><strong id="lastUpdated">Loading</strong></div>
        </div>

        <div class="summary-row" id="summaryRow"></div>

        <div class="dashboard-grid">
          <section class="machine-grid" id="machineGrid" aria-label="Machine status cards"></section>
          <aside class="right-rail">
            <article class="panel" data-permission="viewAlerts">
              <div class="panel-title">
                <h2>Urgent Repair <small id="urgentBadge">0</small></h2>
                <a class="text-button" href="./workorders.html">View all</a>
              </div>
              <div id="urgentRepairList"></div>
            </article>
            <article class="panel" data-permission="viewAlerts">
              <div class="panel-title">
                <h2>PM Due Soon <small id="pmBadge">0</small></h2>
                <a class="text-button" href="./schedule.html">View all</a>
              </div>
              <div id="pmDueList"></div>
            </article>
            <article class="panel">
              <div class="panel-title">
                <h2>Today's Updates</h2>
                <a class="text-button" href="./logs.html">View all</a>
              </div>
              <div class="timeline compact" id="todayUpdates"></div>
            </article>
          </aside>
        </div>
      </main>
    </div>
    <script src="./config.js"></script>
    <script type="module" src="./app.js?v=20260811-schedule-cleanup"></script>
  </body>
</html>
