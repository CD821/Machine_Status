<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | TTS Maintenance</title>
    <meta name="description" content="Configure technicians, issue types, and status labels." />
    <link rel="stylesheet" href="./styles.css?v=20260812-pm-ticket-icon" />
  </head>
  <body data-page="settings">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list">
          <a class="nav-item" href="./index.html"><span class="icon">◴</span><span>Live Status</span></a>
          <a class="nav-item" data-viewer-hidden href="./workorders.html"><span class="icon">▤</span><span>Tickets</span></a>
          <a class="nav-item" data-viewer-hidden href="./schedule.html"><span class="icon">▣</span><span>PM Schedules</span></a>
          <a class="nav-item" data-viewer-hidden href="./machines.html"><span class="icon">▧</span><span>Assets</span></a>
          <a class="nav-item" data-viewer-hidden href="./logs.html"><span class="icon">≡</span><span>Reports</span></a>
          <a class="nav-item active" data-viewer-hidden href="./settings.html"><span class="icon">*</span><span>Settings</span></a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="hamburger" type="button" aria-label="Toggle menu">☰</button>
          <div class="topbar-actions"><span class="user-dot">U</span><span class="shop-user">Shop User</span></div>
        </header>

        <div class="page-heading">
          <div>
            <h1>Settings</h1>
            <p>Manage application configuration and user access</p>
          </div>
        </div>

        <section class="panel" data-permission="manageSettings">
          <div class="panel-title"><h2>Add Setting</h2></div>
          <form class="settings-add-form" id="settingsAddForm">
            <label>
              <span>Type</span>
              <select name="group">
                <option value="technicians">Technician</option>
                <option value="issueTypes">Issue Type</option>
                <option value="statuses">Status</option>
              </select>
            </label>
            <label>
              <span>Name</span>
              <input name="value" type="text" required placeholder="Enter new value" />
            </label>
            <button class="primary-action" type="submit">Add</button>
          </form>
          <p class="settings-save-status" id="settingsSaveStatus" aria-live="polite"></p>
        </section>

        <section class="panel user-access-card" data-permission="manageSettings">
          <div class="panel-title">
            <div>
              <h2>User Access</h2>
              <small>Assign what each signed-in user can see and change.</small>
            </div>
          </div>
          <form class="user-role-form" id="userRoleForm">
            <label>
              <span>User Email</span>
              <input name="email" type="email" required placeholder="name@tts.us.com" />
            </label>
            <label>
              <span>Role</span>
              <select name="role">
                <option value="admin">Admin</option>
                <option value="supervisor">Supervisor</option>
                <option value="technician">Technician</option>
                <option value="viewer">Viewer</option>
              </select>
            </label>
            <button class="primary-action" type="submit">Grant Access</button>
          </form>
          <div class="user-access-list" id="userAccessList"></div>
        </section>

        <div class="settings-grid" id="settingsLists"></div>
      </main>
    </div>
    <script src="./config.js"></script>
    <script type="module" src="./app.js?v=20260812-pm-ticket-icon"></script>
  </body>
</html>
