<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM Schedule | TTS Maintenance</title>
    <meta name="description" content="Preventive maintenance calendar and due-by-hours planning." />
    <link rel="stylesheet" href="./styles.css?v=20260810-ticket-calendar" />
  </head>
  <body data-page="schedule">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list">
          <a class="nav-item" href="./index.html"><span class="icon">◴</span><span>Live Status</span></a>
          <a class="nav-item" data-viewer-hidden href="./workorders.html"><span class="icon">▤</span><span>Tickets</span></a>
          <a class="nav-item active" data-viewer-hidden href="./schedule.html"><span class="icon">▣</span><span>PM Schedules</span></a>
          <a class="nav-item" data-viewer-hidden href="./machines.html"><span class="icon">▧</span><span>Assets</span></a>
          <a class="nav-item" data-viewer-hidden href="./logs.html"><span class="icon">≡</span><span>Reports</span></a>
          <a class="nav-item" data-viewer-hidden href="./settings.html"><span class="icon">*</span><span>Settings</span></a>
        </nav>
        <div class="quick-create">
          <span>Quick Create</span>
          <a class="primary-action" href="./workorders.html">Create Ticket</a>
          <button data-permission="schedulePm" type="button">Schedule PM</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar filters-bar">
          <button class="hamburger" type="button" aria-label="Toggle menu">☰</button>
          <select id="categoryFilter" aria-label="Filter machine"><option value="all">All Machines</option></select>
          <select aria-label="Filter technician"><option>All Technicians</option></select>
          <select aria-label="Filter status"><option>All Statuses</option></select>
          <select aria-label="Filter priority"><option>All Priorities</option></select>
          <span class="control-pill" id="scheduleRangeLabel">This week</span>
        </header>
        <div class="page-heading">
          <h1>PM Schedule</h1>
          <button class="primary-action" data-permission="schedulePm" type="button">Schedule PM</button>
        </div>
        <div class="modal-backdrop" id="workOrderFormPanel" hidden>
          <section class="panel work-order-form-panel modal-card" role="dialog" aria-modal="true" aria-labelledby="workOrderFormTitle">
            <div class="panel-title">
              <h2 id="workOrderFormTitle">Edit Ticket</h2>
              <button class="icon-button" id="cancelWorkOrder" type="button" aria-label="Close ticket form">x</button>
            </div>
            <form class="work-order-form" id="workOrderForm">
              <input name="id" type="hidden" />
              <label class="compact-field"><span>Machine</span><select name="machineId" id="workOrderMachine"></select></label>
              <label><span>Priority</span><select name="priority"><option value="urgent">Urgent</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
              <label><span>Status</span><select name="status" id="workOrderStatus"><option value="open">Open</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select></label>
              <label><span>Schedule Date</span><input name="opened" type="date" /></label>
              <label><span>Assign Technician</span><select name="technician" id="workOrderTechnician"></select></label>
              <label class="wide"><span>Issue</span><input name="issue" type="text" required placeholder="Describe the repair or maintenance issue" /></label>
              <label class="wide"><span>Parts Needed</span><input name="partsNeeded" type="text" placeholder="Pendant switch, seal kit, belt guide" /></label>
              <div class="form-actions wide">
                <button class="primary-action" data-permission="manageWorkOrders" type="submit">Save Ticket</button>
                <button class="outline-button" data-cancel-work-order type="button">Cancel</button>
              </div>
            </form>
          </section>
        </div>
        <div class="schedule-stack">
          <section class="panel calendar-panel">
            <div class="panel-title">
              <h2 id="scheduleTitle">This Week</h2>
              <div class="segmented" id="scheduleSegmented">
                <button class="active" data-schedule-view="week" type="button">Week</button>
                <button data-schedule-view="month" type="button">Month</button>
                <button data-schedule-view="list" type="button">List</button>
              </div>
              <input class="month-picker" id="scheduleMonthPicker" type="month" hidden />
            </div>
            <div class="calendar" id="pmCalendar"></div>
          </section>
          <section class="panel">
            <div class="panel-title"><h2>Tickets</h2><a class="text-button" href="./workorders.html">View all</a></div>
            <div class="table-wrap"><table id="workOrdersTable"></table></div>
          </section>
        </div>
      </main>
    </div>
    <script src="./config.js"></script>
    <script type="module" src="./app.js?v=20260810-ticket-calendar"></script>
  </body>
</html>
